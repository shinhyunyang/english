<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>스마트 영단어 학습기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      overscroll-behavior-y: none;
      font-family: 'Pretendard', 'Inter', sans-serif;
      background-color: #f4f4f5;
      min-height: 100vh;
      min-height: 100dvh;
    }
    
    /* 모바일 글자 이중 렌더링/잔상 방지 */
    .no-subpixel-conflict {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      isolation: isolate;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }

    /* 부드러운 전환 효과 (오버랩 방지) */
    .fade-in {
      animation: smoothFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes smoothFade {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 모바일 스크롤바 감추기 */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-zinc-800 antialiased flex flex-col min-h-[100dvh] justify-between">

  <!-- Mobile Optimized Header -->

    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5 min-w-0">

        </div>
        <div class="min-w-0">

          <p class="text-[10px] text-zinc-500 font-medium flex items-center gap-1 mt-0.5 truncate">
            <span id="syncStatusDot" class="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0"></span>
            <span id="syncStatusText" class="truncate">시트 연동 중...</span>

        <button id="syncNowBtn" title="시트 동기화" class="w-8 h-8 rounded-lg border border-red-200 bg-red-50 text-red-600 flex items-center justify-center active:scale-95 transition">
          <i id="syncNowIcon" class="fa-solid fa-arrows-rotate text-xs"></i>
        </button>
        <button id="toggleListBtn" title="목록" class="px-2 h-8 rounded-lg border border-zinc-200 bg-white text-zinc-700 flex items-center gap-1 text-xs font-semibold active:scale-95 transition">
          <i class="fa-solid fa-list-ul text-[11px] text-zinc-500"></i>
          <span id="totalWordCountBadge" class="text-[11px]">0</span>
        </button>
        <button id="configBtn" title="설정" class="w-8 h-8 rounded-lg border border-zinc-200 bg-white text-zinc-600 flex items-center justify-center active:scale-95 transition">
          <i class="fa-solid fa-gear text-xs"></i>

  </header>

  <!-- Mobile Main Container -->

    <!-- Top Mode Selector & Progress -->

              -

            <p id="aiExampleMeaning" class="text-[11px] text-zinc-500 mt-1 font-normal">
              -
            </p>

      <div class="px-4 py-3 bg-zinc-50 border-t border-zinc-100 flex items-center gap-2">

      </div>
    </div>
  </main>

  <!-- Word List Modal (Mobile Bottom Sheet Style) -->
  <div id="listModal" class="fixed inset-0 bg-zinc-900/60 backdrop-blur-xs z-50 flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4 hidden">

        <div>

          <p class="text-[11px] text-zinc-500">터치하여 원하는 단어로 이동</p>
        </div>
        <button id="closeListBtn" class="w-8 h-8 rounded-full bg-zinc-100 text-zinc-500 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="p-3 border-b border-zinc-100 bg-zinc-50">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-xs"></i>
          <input type="text" id="searchInput" placeholder="단어 또는 해석 검색..." class="w-full pl-8 pr-3 py-2 text-xs bg-white border border-zinc-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-red-500">
        </div>
      </div>

      <div id="wordListContainer" class="flex-1 overflow-y-auto p-3 divide-y divide-zinc-100 hide-scrollbar">

  <!-- Settings Modal -->

    <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl border border-zinc-200 p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-zinc-900 flex items-center gap-1.5">
          <i class="fa-solid fa-sliders text-red-600"></i>
          구글 시트 연동 설정
        </h2>
        <button id="closeSettingsBtn" class="w-7 h-7 rounded-full bg-zinc-100 text-zinc-500 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <div class="space-y-3 mb-4">
        <div>
          <label class="block text-[11px] font-bold text-zinc-700 mb-1">스프레드시트 주소</label>
          <input type="url" id="sheetUrlInput" class="w-full px-3 py-2 text-xs bg-zinc-50 border border-zinc-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-red-500 font-mono" placeholder="https://docs.google.com/...">
        </div>
        <div class="bg-zinc-100 p-2.5 rounded-xl text-[11px] text-zinc-600">
          <p class="font-bold text-zinc-800 mb-0.5">시트 컬럼 기준</p>
          <p>A: 영어 / B: 한국어 해석 / C: 예문</p>
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <button id="resetSampleBtn" class="px-3 py-1.5 rounded-xl border border-zinc-200 text-xs font-semibold text-zinc-600">
          기본값
        </button>
        <button id="saveSheetUrlBtn" class="px-4 py-1.5 rounded-xl bg-red-600 text-white text-xs font-bold shadow-sm">
          연동하기

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 bg-zinc-900/90 text-white text-xs font-semibold rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-1.5 max-w-[90vw] text-center">
    <i id="toastIcon" class="fa-solid fa-check text-red-400 text-xs"></i>
    <span id="toastMsg" class="truncate">알림 메시지</span>

  <script>
    // --- Application State ---
    const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1ScdDH5qBNRQHwZt7_Ib1aWBslTwiWnI6Cbj63PKVY4A/edit?gid=0#gid=0";
    let currentSheetUrl = DEFAULT_SHEET_URL;

    const FALLBACK_WORDS = [
      { english: "meticulous", korean: "세심한, 꼼꼼한", example: "He was meticulous about keeping his desk tidy." },
      { english: "resilience", korean: "회복력, 탄력성", example: "The team showed great resilience in overcoming defeat." },
      { english: "ubiquitous", korean: "어디에나 존재하는", example: "Smartphones have become ubiquitous in daily life." },
      { english: "ephemeral", korean: "일시적인, 덧없는", example: "Fashions are ephemeral, but true style lasts." },
      { english: "lucid", korean: "명쾌한, 명료한", example: "She gave a remarkably lucid explanation of the concept." },
      { english: "pragmatic", korean: "실용적인, 현실적인", example: "We need a pragmatic solution rather than high ideals." },
      { english: "scrutinize", korean: "면밀히 조사하다", example: "The committee scrutinized every clause of the contract." },
      { english: "vulnerable", korean: "취약한, 상처받기 쉬운", example: "Old people are especially vulnerable to the flu." }
    ];

    let words = [...FALLBACK_WORDS];
    let currentIndex = 0;
    let isRevealed = false;
    let studyMode = 'random';
    let currentCardMode = 'enToKo';
    const aiExampleCache = new Map();

    // DOM Elements
    const promptLabel = document.getElementById('promptLabel');
    const promptContent = document.getElementById('promptContent');
    const speakPromptBtn = document.getElementById('speakPromptBtn');
    const answerSection = document.getElementById('answerSection');
    const answerContent = document.getElementById('answerContent');
    const exampleContent = document.getElementById('exampleContent');
    const speakAnswerBtn = document.getElementById('speakAnswerBtn');
    const speakExampleBtn = document.getElementById('speakExampleBtn');

    const aiExampleBox = document.getElementById('aiExampleBox');
    const aiExampleContent = document.getElementById('aiExampleContent');
    const aiExampleMeaning = document.getElementById('aiExampleMeaning');
    const speakAiExampleBtn = document.getElementById('speakAiExampleBtn');

    const revealBtn = document.getElementById('revealBtn');
    const revealBtnIcon = document.getElementById('revealBtnIcon');
    const revealBtnText = document.getElementById('revealBtnText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');

    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const totalWordCountBadge = document.getElementById('totalWordCountBadge');
    const syncStatusDot = document.getElementById('syncStatusDot');
    const syncStatusText = document.getElementById('syncStatusText');

    const modeEnToKo = document.getElementById('modeEnToKo');
    const modeKoToEn = document.getElementById('modeKoToEn');
    const modeRandom = document.getElementById('modeRandom');

    const listModal = document.getElementById('listModal');
    const toggleListBtn = document.getElementById('toggleListBtn');
    const closeListBtn = document.getElementById('closeListBtn');
    const wordListContainer = document.getElementById('wordListContainer');
    const searchInput = document.getElementById('searchInput');

    const settingsModal = document.getElementById('settingsModal');
    const configBtn = document.getElementById('configBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const sheetUrlInput = document.getElementById('sheetUrlInput');
    const saveSheetUrlBtn = document.getElementById('saveSheetUrlBtn');
    const resetSampleBtn = document.getElementById('resetSampleBtn');
    const syncNowBtn = document.getElementById('syncNowBtn');
    const syncNowIcon = document.getElementById('syncNowIcon');

    function parseGoogleSheetUrl(url) {
      try {
        const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        const gidMatch = url.match(/[#&?]gid=([0-9]+)/);
        const sheetId = idMatch ? idMatch[1] : null;
        const gid = gidMatch ? gidMatch[1] : "0";
        return { sheetId, gid };
      } catch (e) {
        return { sheetId: null, gid: "0" };
      }
    }

    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuote = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuote && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuote = !insideQuote;
          }
        } else if (char === ',' && !insideQuote) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuote) {
          if (char === '\r' && nextChar === '\n') {
            i++;
          }
          currentRow.push(currentVal.trim());
          if (currentRow.some(val => val !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(val => val !== '')) {
          rows.push(currentRow);
        }
      }
      return rows;
    }

    async function fetchGoogleSheetWords(url) {
      updateSyncStatus("loading", "시트 불러오는 중...");
      const { sheetId, gid } = parseGoogleSheetUrl(url);

      if (!sheetId) {
        throw new Error("유효하지 않은 시트 주소입니다.");
      }

      const csvEndpoints = [
        `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`,
        `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}`
      ];

      let rawCsv = null;
      for (const endpoint of csvEndpoints) {
        try {
          const res = await fetch(endpoint, { cache: "no-store" });
          if (res.ok) {
            const text = await res.text();
            if (text && !text.includes("<!DOCTYPE html>")) {
              rawCsv = text;
              break;
            }
          }
        } catch (err) {}
      }

      if (!rawCsv) {
        throw new Error("구글 시트를 읽어올 수 없습니다. '링크가 있는 모든 사용자 - 뷰어' 공유를 확인해주세요.");
      }

      const rows = parseCSV(rawCsv);
      if (rows.length === 0) throw new Error("시트가 비어있습니다.");

      let startRowIndex = 0;
      const firstCol = (rows[0][0] || "").toLowerCase();
      if (firstCol.includes("영어") || firstCol.includes("english") || firstCol.includes("단어") || firstCol.includes("word")) {
        startRowIndex = 1;
      }

      const parsed = [];
      for (let i = startRowIndex; i < rows.length; i++) {
        const row = rows[i];
        const english = (row[0] || "").trim();
        const korean = (row[1] || "").trim();
        const example = (row[2] || "").trim();

        if (english || korean) {
          parsed.push({
            english: english || "-",
            korean: korean || "-",
            example: example || "등록된 예문이 없습니다."
          });
        }
      }

      if (parsed.length === 0) throw new Error("단어 데이터가 없습니다.");
      return parsed;
    }

    function updateSyncStatus(status, text) {
      if (status === "loading") {
        syncStatusDot.className = "w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping";
        syncStatusText.textContent = text || "연동 중...";
      } else if (status === "success") {
        syncStatusDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500";
        syncStatusText.textContent = text || "연동 완료";
      } else {
        syncStatusDot.className = "w-1.5 h-1.5 rounded-full bg-rose-500";
        syncStatusText.textContent = text || "샘플 모드";
      }
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = msg;
      toastIcon.className = isError ? "fa-solid fa-circle-exclamation text-rose-400 text-xs" : "fa-solid fa-check text-red-400 text-xs";

      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }

    function determineCardMode() {
      if (studyMode === 'random') {
        currentCardMode = Math.random() < 0.5 ? 'enToKo' : 'koToEn';
      } else {
        currentCardMode = studyMode;
      }
    }

    // AI 예문 1문장 생성 및 캐싱
    async function loadCompanionAiExample(wordItem) {
      const cacheKey = wordItem.english;
      if (aiExampleCache.has(cacheKey)) {
        displayAiExample(aiExampleCache.get(cacheKey));
        return;
      }

      // 초기 대기 텍스트
      aiExampleContent.textContent = "AI가 추가 예문을 생성하고 있습니다...";
      aiExampleMeaning.textContent = "";

      try {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        
        const systemPrompt = "You are a native English teacher. Generate exactly one realistic, natural, clear English example sentence for the given word, followed by its accurate Korean translation. Keep it modern, concise, and easy to memorize.";
        const userPrompt = `Word: "${wordItem.english}" (Meaning: "${wordItem.korean}"). Return exactly a JSON object with keys "en" and "ko". Do not write markdown blocks or backticks.`;

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  "en": { "type": "STRING" },
                  "ko": { "type": "STRING" }
                },
                required: ["en", "ko"]
              }
            }
          })
        });

        const result = await response.json();
        const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (jsonText) {
          const parsed = JSON.parse(jsonText);
          const data = { en: parsed.en, ko: parsed.ko };
          aiExampleCache.set(cacheKey, data);
          if (words[currentIndex]?.english === cacheKey) {
            displayAiExample(data);
          }
        } else {
          throw new Error();
        }
      } catch (e) {
        const fallback = {
          en: `She mastered the word "${wordItem.english}" in no time.`,
          ko: `그녀는 "${wordItem.korean}"의 의미를 금방 마스터했습니다.`
        };
        aiExampleCache.set(cacheKey, fallback);
        if (words[currentIndex]?.english === cacheKey) {
          displayAiExample(fallback);
        }
      }
    }

    function displayAiExample(data) {
      aiExampleContent.textContent = data.en || "-";
      aiExampleMeaning.textContent = data.ko || "";
    }

    function renderCard(resetReveal = true) {
      if (words.length === 0) {
        promptContent.textContent = "단어가 없습니다.";
        return;
      }

      if (resetReveal) {
        isRevealed = false;
        determineCardMode();
      }

      const item = words[currentIndex];
      progressText.textContent = `${currentIndex + 1} / ${words.length}`;
      progressBar.style.width = `${((currentIndex + 1) / words.length) * 100}%`;
      totalWordCountBadge.textContent = words.length;

      // 폰트 잔상 및 중복 표기 방지: 텍스트를 깔끔하게 교체
      if (currentCardMode === 'enToKo') {
        promptLabel.textContent = "English Word (A)";
        promptContent.textContent = item.english;
        promptContent.className = "text-2xl sm:text-3xl font-extrabold text-zinc-900 tracking-tight leading-snug py-1";

        // 영어일 때만 윗칸 발음 표시
        speakPromptBtn.classList.remove('hidden');

        answerContent.textContent = item.korean;
        speakAnswerBtn.classList.add('hidden');
      } else {
        promptLabel.textContent = "Korean Meaning (B)";
        promptContent.textContent = item.korean;
        promptContent.className = "text-xl sm:text-2xl font-bold text-zinc-900 tracking-tight leading-snug py-1";

        // 한국어일 때 윗칸 발음 제거
        speakPromptBtn.classList.add('hidden');

        answerContent.textContent = item.english;
        if (!isRevealed) {
          speakAnswerBtn.classList.add('hidden');
        } else {
          speakAnswerBtn.classList.remove('hidden');
        }
      }

      exampleContent.textContent = item.example;

      if (isRevealed) {
        answerSection.classList.remove('hidden');
        revealBtnText.textContent = "Next";
        revealBtnIcon.className = "fa-solid fa-arrow-right text-xs";
        revealBtn.className = "flex-1 h-11 px-4 rounded-xl bg-zinc-900 hover:bg-black text-white font-bold text-sm shadow-md active:scale-98 transition flex items-center justify-center gap-1.5";
        
        // AI 예문 트리거
        loadCompanionAiExample(item);
      } else {
        answerSection.classList.add('hidden');
        revealBtnText.textContent = "정답 & 예문 확인";
        revealBtnIcon.className = "fa-solid fa-eye text-xs";
        revealBtn.className = "flex-1 h-11 px-4 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 text-white font-bold text-sm shadow-md shadow-red-500/20 active:scale-98 transition flex items-center justify-center gap-1.5";
      }

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === words.length - 1;
    }

    function handleRevealOrNext() {
      if (!isRevealed) {
        isRevealed = true;
        renderCard(false);
      } else {
        if (currentIndex < words.length - 1) {
          currentIndex++;
          renderCard(true);
        } else {
          showToast("마지막 단어입니다!");
        }
      }
    }

    function handlePrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard(true);
      }
    }

    function handleNext() {
      if (currentIndex < words.length - 1) {
        currentIndex++;
        renderCard(true);
      }
    }

    function getUSFemaleVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      const femaleIdentifiers = [
        'samantha', 'victoria', 'jenny', 'zira', 'ava', 'allison', 
        'karen', 'google us english', 'natural', 'female'
      ];

      for (const id of femaleIdentifiers) {
        const match = voices.find(v => 
          (v.lang === 'en-US' || v.lang === 'en_US') && 
          v.name.toLowerCase().includes(id)
        );
        if (match) return match;
      }

      const genericFemale = voices.find(v => 
        v.lang.startsWith('en') && /female|woman/i.test(v.name)
      );
      if (genericFemale) return genericFemale;

      const anyUsVoice = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
      if (anyUsVoice) return anyUsVoice;

      return voices.find(v => v.lang.startsWith('en')) || null;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function speakText(text, lang = 'en-US') {
      if (!('speechSynthesis' in window)) {
        showToast("음성 기능이 지원되지 않는 브라우저입니다.", true);
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 1.1; // 1.1배속

      if (lang.startsWith('en')) {
        const femaleVoice = getUSFemaleVoice();
        if (femaleVoice) utterance.voice = femaleVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakPrompt() {
      const item = words[currentIndex];
      if (!item) return;
      if (currentCardMode === 'enToKo') {
        speakText(item.english, 'en-US');
      }
    }

    function speakCurrentWord() {
      const item = words[currentIndex];
      if (item && item.english) {
        speakText(item.english, 'en-US');
      }
    }

    function speakCurrentExample() {
      const item = words[currentIndex];
      if (item && item.example && item.example !== "등록된 예문이 없습니다.") {
        speakText(item.example, 'en-US');
      }
    }

    function speakCompanionExample() {
      const item = words[currentIndex];
      if (!item) return;
      const data = aiExampleCache.get(item.english);
      if (data && data.en) {
        speakText(data.en, 'en-US');
      }
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function shuffleWords(showToastMessage = true) {
      shuffleArray(words);
      currentIndex = 0;
      renderCard(true);
      if (showToastMessage) showToast("단어를 무작위로 섞었습니다.");
    }

    function renderWordList(filter = '') {
      wordListContainer.innerHTML = '';
      const lower = filter.toLowerCase().trim();

      const filtered = words
        .map((w, idx) => ({ ...w, originalIndex: idx }))
        .filter(w => w.english.toLowerCase().includes(lower) || w.korean.toLowerCase().includes(lower));

      if (filtered.length === 0) {
        wordListContainer.innerHTML = `<div class="text-center py-6 text-zinc-400 text-xs">검색 결과가 없습니다.</div>`;
        return;
      }

      filtered.forEach((item) => {
        const isCurrent = item.originalIndex === currentIndex;
        const row = document.createElement('div');
        row.className = `p-2.5 rounded-xl cursor-pointer flex items-center justify-between transition ${isCurrent ? 'bg-red-50 border border-red-200' : 'hover:bg-zinc-50'}`;
        
        row.innerHTML = `
          <div class="flex-1 min-w-0 pr-2">
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] font-bold text-zinc-400">#${item.originalIndex + 1}</span>
              <span class="font-bold text-xs truncate ${isCurrent ? 'text-red-700' : 'text-zinc-900'}">${item.english}</span>
            </div>
            <p class="text-[11px] text-zinc-500 truncate mt-0.5">${item.korean}</p>
          </div>
          <button class="speak-item-btn w-7 h-7 rounded-lg text-zinc-400 hover:text-red-600 flex items-center justify-center shrink-0" data-word="${item.english}">
            <i class="fa-solid fa-volume-high text-[11px]"></i>
          </button>
        `;

        row.addEventListener('click', (e) => {
          if (e.target.closest('.speak-item-btn')) {
            e.stopPropagation();
            speakText(item.english, 'en-US');
            return;
          }
          currentIndex = item.originalIndex;
          renderCard(true);
          listModal.classList.add('hidden');
        });

        wordListContainer.appendChild(row);
      });
    }

    revealBtn.addEventListener('click', handleRevealOrNext);
    prevBtn.addEventListener('click', handlePrev);
    nextBtn.addEventListener('click', handleNext);
    shuffleBtn.addEventListener('click', () => shuffleWords(true));

    if (speakPromptBtn) speakPromptBtn.addEventListener('click', speakPrompt);
    if (speakAnswerBtn) speakAnswerBtn.addEventListener('click', speakCurrentWord);
    if (speakExampleBtn) speakExampleBtn.addEventListener('click', speakCurrentExample);
    if (speakAiExampleBtn) speakAiExampleBtn.addEventListener('click', speakCompanionExample);

    // Sync button
    syncNowBtn.addEventListener('click', async () => {
      syncNowBtn.disabled = true;
      syncNowIcon.classList.add('fa-spin');
      showToast("동기화 중...");
      try {
        await loadSheetData(currentSheetUrl);
      } finally {
        syncNowIcon.classList.remove('fa-spin');
        syncNowBtn.disabled = false;
      }
    });

    // Study Mode switchers
    function setStudyMode(mode) {
      studyMode = mode;
      const activeClass = "py-1.5 text-[11px] font-bold rounded-lg transition-all shadow-xs bg-white text-red-600";
      const inactiveClass = "py-1.5 text-[11px] font-semibold rounded-lg text-zinc-600 transition-all";

      modeRandom.className = mode === 'random' ? activeClass : inactiveClass;
      modeEnToKo.className = mode === 'enToKo' ? activeClass : inactiveClass;
      modeKoToEn.className = mode === 'koToEn' ? activeClass : inactiveClass;

      renderCard(true);
    }

    modeEnToKo.addEventListener('click', () => setStudyMode('enToKo'));
    modeKoToEn.addEventListener('click', () => setStudyMode('koToEn'));
    modeRandom.addEventListener('click', () => setStudyMode('random'));

    // Keyboard navigation (for tablets & desktop)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        handleRevealOrNext();
      } else if (e.code === 'ArrowLeft') {
        handlePrev();
      } else if (e.code === 'ArrowRight') {
        handleNext();
      }
    });

    // Touch Swipe for mobile cards
    let touchStartX = 0;
    let touchEndX = 0;
    const flashcardEl = document.getElementById('flashcard');

    flashcardEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    flashcardEl.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) {
        handleNext(); // Swipe Left -> Next
      } else if (touchEndX - touchStartX > 50) {
        handlePrev(); // Swipe Right -> Prev
      }
    }, { passive: true });

    // Modals
    toggleListBtn.addEventListener('click', () => {
      renderWordList();
      listModal.classList.remove('hidden');
      searchInput.value = '';
    });
    closeListBtn.addEventListener('click', () => listModal.classList.add('hidden'));
    listModal.addEventListener('click', (e) => {
      if (e.target === listModal) listModal.classList.add('hidden');
    });

    searchInput.addEventListener('input', (e) => renderWordList(e.target.value));

    configBtn.addEventListener('click', () => {
      sheetUrlInput.value = currentSheetUrl;
      settingsModal.classList.remove('hidden');
    });
    closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.add('hidden');
    });

    resetSampleBtn.addEventListener('click', () => {
      sheetUrlInput.value = DEFAULT_SHEET_URL;
    });

    saveSheetUrlBtn.addEventListener('click', async () => {
      const newUrl = sheetUrlInput.value.trim();
      if (!newUrl) return;
      currentSheetUrl = newUrl;
      settingsModal.classList.add('hidden');
      await loadSheetData(currentSheetUrl);
    });

    async function loadSheetData(url) {
      try {
        const fetchedWords = await fetchGoogleSheetWords(url);
        words = fetchedWords;
        shuffleArray(words);
        currentIndex = 0;
        updateSyncStatus("success", `연동됨 (${words.length}개)`);
        renderCard(true);
        showToast(`${words.length}개 단어가 준비되었습니다.`);
      } catch (err) {
        updateSyncStatus("error", "권한 확인 필요");
        showToast("시트 접근 권한 확인 필요 (기본 단어장 실행)", true);
        words = [...FALLBACK_WORDS];
        shuffleArray(words);
        currentIndex = 0;
        renderCard(true);
      }
    }

    window.addEventListener('load', () => {
      shuffleArray(words);
      sheetUrlInput.value = currentSheetUrl;
      loadSheetData(currentSheetUrl);
    });
  </script>
</body>
</html>
