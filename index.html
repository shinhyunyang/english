  <script>
    // --- Application State ---
    const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1ScdDH5qBNRQHwZt7_Ib1aWBslTwiWnI6Cbj63PKVY4A/edit?gid=0#gid=0";
    let currentSheetUrl = DEFAULT_SHEET_URL;

    // Built-in fallback sample dataset in case user's sheet is not shared as public yet
    const FALLBACK_WORDS = [
      { english: "meticulous", korean: "세심한, 꼼꼼한", example: "He was meticulous about keeping his desk tidy." },
      { english: "resilience", korean: "회복력, 탄력성", example: "The team showed great resilience in overcoming defeat." },
      { english: "ubiquitous", korean: "어디에나 존재하는", example: "Smartphones have become ubiquitous in daily life." },
      { english: "ephemeral", korean: "일시적인, 덧없는", example: "Fashions are ephemeral, but true style lasts." },
      { english: "lucid", korean: "명쾌한, 명료한", example: "She gave a remarkably lucid explanation of the concept." },

      { english: "vulnerable", korean: "취약한, 상처받기 쉬운", example: "Old people are especially vulnerable to the flu." }
    ];

    let words = [...FALLBACK_WORDS];
    let currentIndex = 0;
    let isRevealed = false;
    let studyMode = 'random'; // Default to random presentation (A or B column randomly chosen)
    let currentCardMode = 'enToKo'; // randomly decided per card
    let bookmarkedIndices = new Set();

    // DOM Elements
    const promptLabel = document.getElementById('promptLabel');
    const promptContent = document.getElementById('promptContent');
    const promptSub = document.getElementById('promptSub');
    const speakPromptBtn = document.getElementById('speakPromptBtn');
    const answerSection = document.getElementById('answerSection');
    const answerContent = document.getElementById('answerContent');
    const exampleBox = document.getElementById('exampleBox');
    const exampleContent = document.getElementById('exampleContent');
    const badgeLabel = document.getElementById('badgeLabel');
    const badgeIconContainer = document.getElementById('badgeIconContainer');
    const sheetRowBadge = document.getElementById('sheetRowBadge');
    const questionTypeBadge = document.getElementById('questionTypeBadge');

    const revealBtn = document.getElementById('revealBtn');
    const revealBtnIcon = document.getElementById('revealBtnIcon');
    const revealBtnText = document.getElementById('revealBtnText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    /**
     * Extracts Sheet ID and GID from given Google Sheet URL
     */
    function parseGoogleSheetUrl(url) {
      try {
        const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        const gidMatch = url.match(/[#&?]gid=([0-9]+)/);
        const sheetId = idMatch ? idMatch[1] : null;
        const gid = gidMatch ? gidMatch[1] : "0";
        return { sheetId, gid };
      } catch (e) {
        return { sheetId: null, gid: "0" };
      }
    }

    /**
     * Parse raw CSV text safely handling quotes, commas, and newlines
     */
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuote = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuote && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuote = !insideQuote;
          }
        } else if (char === ',' && !insideQuote) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuote) {
          if (char === '\r' && nextChar === '\n') {
            i++;
          }
          currentRow.push(currentVal.trim());
          if (currentRow.some(val => val !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(val => val !== '')) {
          rows.push(currentRow);
        }
      }
      return rows;
    }

    /**
     * Fetches words from Google Sheet export endpoint
     */
    async function fetchGoogleSheetWords(url) {
      updateSyncStatus("loading", "시트 데이터 불러오는 중...");
      const { sheetId, gid } = parseGoogleSheetUrl(url);

      if (!sheetId) {
        throw new Error("유효하지 않은 구글 시트 URL입니다.");
      }

      // Try Google Sheets CSV export URLs
      const csvEndpoints = [
        `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`,
        `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}`
      ];

      let rawCsv = null;
      let lastError = null;

      for (const endpoint of csvEndpoints) {
        try {
          const res = await fetch(endpoint, { cache: "no-store" });
          if (res.ok) {
            const text = await res.text();
            if (text && !text.includes("<!DOCTYPE html>")) {
              rawCsv = text;
              break;
            }
          }
        } catch (err) {
          lastError = err;
        }
      }

      if (!rawCsv) {
        throw new Error("구글 시트를 읽어올 수 없습니다. '공유' 설정에서 '링크가 있는 모든 사용자에게 공개(뷰어)'로 되어있는지 확인하세요.");
      }

      const rows = parseCSV(rawCsv);
      if (rows.length === 0) {
        throw new Error("시트에 데이터가 비어 있습니다.");
      }

      // Detect header row (e.g. "영어", "해석", "예문" or "English", "Korean")
      let startRowIndex = 0;
      const firstRowFirstCol = (rows[0][0] || "").toLowerCase();
      if (firstRowFirstCol.includes("영어") || firstRowFirstCol.includes("english") || firstRowFirstCol.includes("단어") || firstRowFirstCol.includes("word")) {
        startRowIndex = 1;
      }

      const parsedWords = [];
      for (let i = startRowIndex; i < rows.length; i++) {
        const row = rows[i];
        const english = (row[0] || "").trim();
        const korean = (row[1] || "").trim();
        const example = (row[2] || "").trim();

        // Include row if either English or Korean exists
        if (english || korean) {
          parsedWords.push({
            english: english || "-",
            korean: korean || "-",
            example: example || "등록된 예문이 없습니다."
          });
        }
      }

      if (parsedWords.length === 0) {
        throw new Error("유효한 단어 데이터가 시트에 없습니다.");
      }

      return parsedWords;
    }

    function updateSyncStatus(status, text) {
      if (status === "loading") {
        syncStatusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-ping";
        syncStatusText.textContent = text || "연결 중...";
      } else if (status === "success") {
        syncStatusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
        syncStatusText.textContent = text || "구글 시트 연동 완료";
      } else if (status === "error") {
        syncStatusDot.className = "w-2 h-2 rounded-full bg-rose-500";
        syncStatusText.textContent = text || "연동 실패 (샘플 모드)";
      }
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = msg;
      if (isError) {
        toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
      } else {
        toastIcon.className = "fa-solid fa-check text-red-400";
      }

      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2600);
    }

    function determineCardMode() {
      if (studyMode === 'random') {
        currentCardMode = Math.random() < 0.5 ? 'enToKo' : 'koToEn';
      } else {
        currentCardMode = studyMode;
      }
    }

    function renderCard(resetReveal = true) {
      if (words.length === 0) {
        promptContent.textContent = "단어가 없습니다.";
        return;
      }

      if (resetReveal) {
        isRevealed = false;
        determineCardMode();
      }

      const item = words[currentIndex];
      progressText.textContent = `${currentIndex + 1} / ${words.length}`;
      progressBar.style.width = `${((currentIndex + 1) / words.length) * 100}%`;
      totalWordCountBadge.textContent = words.length;

      if (currentCardMode === 'enToKo') {
        promptLabel.textContent = "English Word (A)";
        promptContent.textContent = item.english;
        promptContent.className = "text-3xl sm:text-4xl md:text-5xl font-black text-zinc-900 tracking-tight leading-tight mb-2";

        // 영어 단어일 때는 발음 듣기 표시
        speakPromptBtn.classList.remove('hidden');

        answerContent.textContent = item.korean;
        answerContent.className = "text-2xl sm:text-3xl font-extrabold text-red-600";
        speakAnswerBtn.classList.add('hidden');
      } else {
        promptLabel.textContent = "Korean Meaning (B)";
        promptContent.textContent = item.korean;
        promptContent.className = "text-2xl sm:text-3xl md:text-4xl font-extrabold text-zinc-900 tracking-tight leading-snug mb-2";

        // Korean Meaning일 때는 발음 듣기 표시 숨김
        speakPromptBtn.classList.add('hidden');

        answerContent.textContent = item.english;
        answerContent.className = "text-2xl sm:text-3xl font-extrabold text-red-600";

        if (!isRevealed) {
          speakAnswerBtn.classList.add('hidden');
        } else {
          speakAnswerBtn.classList.remove('hidden');
        }
      }

      exampleContent.textContent = item.example;

      // Show/Hide Reveal State with Gray & Red Button styling
      if (isRevealed) {
        answerSection.classList.remove('hidden');
        revealBtnText.textContent = "Next";
        revealBtnIcon.className = "fa-solid fa-arrow-right";
        revealBtn.className = "flex-1 max-w-xs py-3 px-6 rounded-xl bg-zinc-900 hover:bg-black text-white font-bold text-sm sm:text-base shadow-lg shadow-zinc-900/25 active:scale-95 transition-all flex items-center justify-center gap-2";
      } else {
        answerSection.classList.add('hidden');
        revealBtnText.textContent = "정답 & 예문 확인";
        revealBtnIcon.className = "fa-solid fa-eye";
        revealBtn.className = "flex-1 max-w-xs py-3 px-6 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white font-bold text-sm sm:text-base shadow-lg shadow-red-500/25 active:scale-95 transition-all flex items-center justify-center gap-2";
      }

      // Prev / Next button state
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === words.length - 1;
    }

    function handleRevealOrNext() {
      if (!isRevealed) {
        isRevealed = true;
        renderCard(false);
      } else {
        // If already revealed, move to next card
        if (currentIndex < words.length - 1) {
          currentIndex++;
          renderCard(true);
        } else {
          showToast("마지막 단어입니다! 처음으로 돌아가거나 순서를 섞어보세요.");
        }
      }
    }

    function handlePrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard(true);
      }
    }

    function handleNext() {
      if (currentIndex < words.length - 1) {
        currentIndex++;
        renderCard(true);
      }
    }

    // Helper to find the best available US English female voice
    function getUSFemaleVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      // Priority list of popular high-quality US Female voices across Windows, macOS, iOS, Android, and Chrome
      const femaleIdentifiers = [
        'samantha', 'victoria', 'jenny', 'zira', 'ava', 'allison', 
        'karen', 'google us english', 'natural', 'female'
      ];

      // 1. Try to find an en-US voice matching known female names
      for (const identifier of femaleIdentifiers) {
        const match = voices.find(v => 
          (v.lang === 'en-US' || v.lang === 'en_US') && 
          v.name.toLowerCase().includes(identifier)
        );
        if (match) return match;
      }

      // 2. Try any English voice with 'female' in its name
      const genericFemale = voices.find(v => 
        v.lang.startsWith('en') && 
        /female|woman/i.test(v.name)
      );
      if (genericFemale) return genericFemale;

      // 3. Fallback to any en-US voice
      const anyUsVoice = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
      if (anyUsVoice) return anyUsVoice;

      return voices.find(v => v.lang.startsWith('en')) || null;
    }

    // Preload available voices
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function speakText(text, lang = 'en-US') {
      if (!('speechSynthesis' in window)) {
        showToast("브라우저가 음성 듣기(TTS)를 지원하지 않습니다.", true);
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 1.1; // 1.1배속 설정

      // 미국 여성 음성 매칭 적용
      if (lang.startsWith('en')) {
        const femaleVoice = getUSFemaleVoice();
        if (femaleVoice) {
          utterance.voice = femaleVoice;
        }
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakPrompt() {
      const item = words[currentIndex];
      if (!item) return;

      if (currentCardMode === 'enToKo') {
        speakText(item.english, 'en-US');
      } else {
        speakText(item.korean, 'ko-KR');
      }
    }

    function speakCurrentWord() {
      // In Korean question mode before reveal, do not spoil the English word!
      if (currentCardMode === 'koToEn' && !isRevealed) {
        showToast("🔒 정답(영어)을 확인한 후에 발음을 들을 수 있습니다!", false);
        return;
      }

      const item = words[currentIndex];
      if (item && item.english) {
        speakText(item.english, 'en-US');
      }
    }

    function speakCurrentExample() {
      const item = words[currentIndex];
      if (item && item.example && item.example !== "등록된 예문이 없습니다.") {
        speakText(item.example, 'en-US');
      }
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function shuffleWords(showToastMessage = true) {
      shuffleArray(words);
      currentIndex = 0;
      bookmarkedIndices.clear();
      renderCard(true);
      if (showToastMessage) {
        showToast("단어 순서를 무작위로 섞었습니다.");
      }
    }

    function renderWordList(filter = '') {
      wordListContainer.innerHTML = '';
      const lower = filter.toLowerCase().trim();

      const filtered = words
        .map((w, idx) => ({ ...w, originalIndex: idx }))
        .filter(w => w.english.toLowerCase().includes(lower) || w.korean.toLowerCase().includes(lower));

      if (filtered.length === 0) {
        wordListContainer.innerHTML = `
          <div class="text-center py-8 text-zinc-400 text-xs">
            일치하는 단어가 없습니다.
          </div>
        `;
        return;
      }

      filtered.forEach((item) => {
        const isCurrent = item.originalIndex === currentIndex;
        const row = document.createElement('div');
        row.className = `p-3 rounded-xl hover:bg-zinc-100 cursor-pointer flex items-center justify-between transition ${isCurrent ? 'bg-red-50/80 border border-red-200' : ''}`;
        
        row.innerHTML = `
          <div class="flex-1 pr-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono font-bold text-zinc-400">#${item.originalIndex + 1}</span>
              <span class="font-bold text-zinc-900 text-sm ${isCurrent ? 'text-red-700' : ''}">${item.english}</span>
            </div>
            <p class="text-xs text-zinc-500 mt-0.5">${item.korean}</p>
          </div>
          <div class="flex items-center gap-2">
            <button class="speak-item-btn p-1.5 rounded-lg text-zinc-400 hover:text-red-600 hover:bg-white text-xs transition" data-word="${item.english}">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <i class="fa-solid fa-chevron-right text-zinc-300 text-xs"></i>
          </div>
        `;

        row.addEventListener('click', (e) => {
          if (e.target.closest('.speak-item-btn')) {
            e.stopPropagation();
            speakText(item.english, 'en-US');
            return;
          }
          currentIndex = item.originalIndex;
          renderCard(true);
          listModal.classList.add('hidden');
        });

        wordListContainer.appendChild(row);
      });
    }

    revealBtn.addEventListener('click', handleRevealOrNext);
    prevBtn.addEventListener('click', handlePrev);
    nextBtn.addEventListener('click', handleNext);
    shuffleBtn.addEventListener('click', shuffleWords);

    if (speakPromptBtn) speakPromptBtn.addEventListener('click', speakPrompt);

    // Manual Refresh / Sync Button Event
    syncNowBtn.addEventListener('click', async () => {
      syncNowBtn.disabled = true;
      syncNowIcon.classList.add('fa-spin');
      showToast("구글 시트에서 최신 데이터를 동기화하는 중입니다...");
      
      try {
        await loadSheetData(currentSheetUrl);
      } finally {
        syncNowIcon.classList.remove('fa-spin');
        syncNowBtn.disabled = false;
      }
    });

    if (speakBtn) speakBtn.addEventListener('click', speakCurrentWord);
    speakAnswerBtn.addEventListener('click', speakCurrentWord);
    speakExampleBtn.addEventListener('click', speakCurrentExample);

    if (bookmarkBtn) {
      bookmarkBtn.addEventListener('click', () => {
        if (bookmarkedIndices.has(currentIndex)) {
          bookmarkedIndices.delete(currentIndex);
          showToast("북마크가 해제되었습니다.");
        } else {
          bookmarkedIndices.add(currentIndex);
          showToast("단어를 북마크에 추가했습니다!");
        }
        renderCard(false);
      });
    }

    // Study Mode Change
    function setStudyMode(mode) {
      studyMode = mode;
      modeEnToKo.className = mode === 'enToKo' 
        ? "flex-1 sm:flex-none px-3.5 py-1.5 text-xs font-bold rounded-lg transition-all shadow-sm bg-white text-red-600"
        : "flex-1 sm:flex-none px-3.5 py-1.5 text-xs font-semibold rounded-lg text-zinc-600 hover:text-zinc-900 transition-all";
      modeKoToEn.className = mode === 'koToEn' 
        ? "flex-1 sm:flex-none px-3.5 py-1.5 text-xs font-bold rounded-lg transition-all shadow-sm bg-white text-red-600"
        : "flex-1 sm:flex-none px-3.5 py-1.5 text-xs font-semibold rounded-lg text-zinc-600 hover:text-zinc-900 transition-all";
      modeRandom.className = mode === 'random' 
        ? "flex-1 sm:flex-none px-3.5 py-1.5 text-xs font-bold rounded-lg transition-all shadow-sm bg-white text-red-600"
        : "flex-1 sm:flex-none px-3.5 py-1.5 text-xs font-semibold rounded-lg text-zinc-600 hover:text-zinc-900 transition-all";

      renderCard(true);
    }

    modeEnToKo.addEventListener('click', () => setStudyMode('enToKo'));
    modeKoToEn.addEventListener('click', () => setStudyMode('koToEn'));
    modeRandom.addEventListener('click', () => setStudyMode('random'));

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      // Don't trigger shortcuts if user is typing in an input
      if (e.target.tagName === 'INPUT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        handleRevealOrNext();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        handlePrev();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        handleNext();
      } else if (e.key === 'v' || e.key === 'V') {
        speakCurrentWord();
      } else if (e.key === 'e' || e.key === 'E') {
        speakCurrentExample();
      }
    });

    // Modal controls
    toggleListBtn.addEventListener('click', () => {
      renderWordList();
      listModal.classList.remove('hidden');
      searchInput.value = '';
      searchInput.focus();
    });

    closeListBtn.addEventListener('click', () => listModal.classList.add('hidden'));
    listModal.addEventListener('click', (e) => {
      if (e.target === listModal) listModal.classList.add('hidden');
    });

    searchInput.addEventListener('input', (e) => {
      renderWordList(e.target.value);
    });

    configBtn.addEventListener('click', () => {
      sheetUrlInput.value = currentSheetUrl;
      settingsModal.classList.remove('hidden');
    });

    closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.add('hidden');
    });

    openSheetBtn.addEventListener('click', () => {
      window.open(currentSheetUrl, '_blank');
    });

    resetSampleBtn.addEventListener('click', () => {
      sheetUrlInput.value = DEFAULT_SHEET_URL;
    });

    saveSheetUrlBtn.addEventListener('click', async () => {
      const newUrl = sheetUrlInput.value.trim();
      if (!newUrl) {
        showToast("URL을 입력해주세요.", true);
        return;
      }
      currentSheetUrl = newUrl;
      settingsModal.classList.add('hidden');
      await loadSheetData(currentSheetUrl);
    });

    async function loadSheetData(url) {
      try {
        const fetchedWords = await fetchGoogleSheetWords(url);
        words = fetchedWords;
        shuffleArray(words);
        currentIndex = 0;
        updateSyncStatus("success", `동기화 완료 (${words.length}개 단어 - 랜덤 셔플됨)`);
        renderCard(true);
        showToast(`구글 시트 연동 완료! 총 ${words.length}개 단어가 랜덤하게 배치되었습니다.`);
      } catch (err) {
        console.warn("Sheet Load Error: ", err);
        updateSyncStatus("error", "시트 권한 확인 필요 (샘플 데이터 사용 중)");
        showToast("시트 접근 권한을 확인해주세요. 기본 단어장으로 시작합니다.", true);
        words = [...FALLBACK_WORDS];
        shuffleArray(words);
        currentIndex = 0;
        renderCard(true);
      }
    }

    // Window Load Initiation
    window.addEventListener('load', () => {
      shuffleArray(words);
      sheetUrlInput.value = currentSheetUrl;
      loadSheetData(currentSheetUrl);
    });
  </script>
</body>
</html>
